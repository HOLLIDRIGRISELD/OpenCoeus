[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencoeus"
version = "0.6.0"
description = "Local-first hybrid AI file organisation and document retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenCoeus Project" }]
keywords = ["file-management", "document-classification", "semantic-search", "local-ai"]

dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "PyMuPDF>=1.23",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ai = ["sentence-transformers>=2.7", "torch>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.0"]
ocr = ["pytesseract>=0.3"]

[project.scripts]
opencoeus = "app.cli:main"
opencoeus-gui = "app.ui.app:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*", "main.py"]
